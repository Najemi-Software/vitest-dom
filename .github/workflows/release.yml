name: Release
on:
  push:
    branches:
      - "master"
      # prerelease channel
      - "alpha"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: "Lint"
        run: pnpm run lint

      - name: "Build"
        run: pnpm run build

      - name: "Commit formatting check"
        uses: wagoid/commitlint-github-action@v6

      # Publishes the package to npm, idempotently. Reads the version from
      # package.json. Publishes to dist-tag "latest", then creates and pushes
      # a git tag v<version> at HEAD and a GitHub release with
      # semantic-release-style notes. If the version is already on the
      # registry the publish is skipped, but a missing tag/release is still
      # created (repairs a previous run that failed after publishing).
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          pkg_name="$(npm pkg get name | tr -d '"')"
          version="$(npm pkg get version | tr -d '"')"

          if ! grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' <<< "$version"; then
            echo "::error::Version '${version}' is not a stable X.Y.Z version."
            exit 1
          fi

          git_tag="v${version}"
          repo_url="https://github.com/${REPO}"

          # Availability is decided on output, not exit code: npm view of a
          # missing version exits 0 with empty output on some npm versions.
          on_registry="$(npm view "${pkg_name}@${version}" version 2> /dev/null || true)"

          if [ -z "$on_registry" ]; then
            # Auth via a throwaway user-level npmrc so the repo needs no .npmrc;
            # the file holds only the env reference, never the token itself.
            NPM_CONFIG_USERCONFIG="$(mktemp)"
            export NPM_CONFIG_USERCONFIG
            echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
            npm publish --access public --tag latest
            rm -f "$NPM_CONFIG_USERCONFIG"
            unset NPM_CONFIG_USERCONFIG
            npm_result="published"
            echo "Published ${pkg_name}@${version} (dist-tag: latest)."
          else
            npm_result="already on registry, skipped"
            echo "${pkg_name}@${version} is already on the registry; skipping npm publish."
          fi

          # Previous release tag (highest version tag other than this one),
          # resolved before creating the new tag.
          prev_tag="$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -vx "$git_tag" | head -1 || true)"

          if gh api "repos/${REPO}/git/ref/tags/${git_tag}" > /dev/null 2>&1; then
            tag_result="already existed"
          else
            git tag -f "$git_tag"
            git push origin "refs/tags/${git_tag}"
            tag_result="created at $(git rev-parse HEAD)"
          fi
          echo "Git tag ${git_tag}: ${tag_result}."

          # Release notes in the conventional-changelog format that
          # semantic-release produces.
          release_date="$(date +%Y-%m-%d)"
          if [ -n "$prev_tag" ]; then
            header="# [${version}](${repo_url}/compare/${prev_tag}...${git_tag}) (${release_date})"
            range="${prev_tag}..HEAD"
          else
            header="# ${version} (${release_date})"
            range="HEAD"
          fi

          fixes=""
          features=""
          perf=""
          re='^(feat|fix|perf)(\(([^)]+)\))?!?: (.*)$'
          while IFS=$'\t' read -r sha subject; do
            [[ "$subject" =~ $re ]] || continue
            type="${BASH_REMATCH[1]}"
            scope="${BASH_REMATCH[3]}"
            desc="${BASH_REMATCH[4]}"
            link="([${sha:0:7}](${repo_url}/commit/${sha}))"
            if [ -n "$scope" ]; then
              line="* **${scope}:** ${desc} ${link}"
            else
              line="* ${desc} ${link}"
            fi
            case "$type" in
              fix)  fixes+="${line}"$'\n' ;;
              feat) features+="${line}"$'\n' ;;
              perf) perf+="${line}"$'\n' ;;
            esac
          done < <(git log --reverse --format='%H%x09%s' "$range")

          notes_file="$(mktemp)"
          {
            echo "$header"
            echo ""
            if [ -n "$fixes" ]; then
              echo ""
              echo "### Bug Fixes"
              echo ""
              printf '%s' "$fixes"
              echo ""
            fi
            if [ -n "$features" ]; then
              echo ""
              echo "### Features"
              echo ""
              printf '%s' "$features"
              echo ""
            fi
            if [ -n "$perf" ]; then
              echo ""
              echo "### Performance Improvements"
              echo ""
              printf '%s' "$perf"
              echo ""
            fi
            echo ""
            echo ""
          } > "$notes_file"

          if gh release view "${git_tag}" --repo "${REPO}" > /dev/null 2>&1; then
            release_result="already existed"
          else
            gh release create "${git_tag}" --repo "${REPO}" \
              --title "${git_tag}" --notes-file "$notes_file" --verify-tag > /dev/null
            release_result="created"
          fi
          echo "GitHub release ${git_tag}: ${release_result}."

          {
            echo "### NPM Publish"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Package | \`${pkg_name}\` |"
            echo "| Version | \`${version}\` |"
            echo "| Dist-tag | \`latest\` |"
            echo "| npm publish | ${npm_result} |"
            echo "| Git tag | ${tag_result} |"
            echo "| GitHub release | ${release_result} |"
            echo ""
            echo "\`\`\`"
            echo "npm i ${pkg_name}@latest"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
